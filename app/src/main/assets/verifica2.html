  --v-bg: #0d1512;

  --v-muted: #8fa39a;
  --v-green: #22c58b;
  --v-green-dim: #123c2c;

@media (prefers-color-scheme: light) {

    --v-text: #16211c; --v-muted: #5c6b64;

html, body { height: 100%; margin: 0; background: var(--v-bg); }
body { color: var(--v-text); display: flex; align-items: center; justify-content: center; padding: 20px; }

.device {

  padding: 14px;
}
.screen {
  background: var(--v-panel);
  border-radius: 16px;
  overflow: hidden;
  min-height: 620px;
  display: flex;
  flex-direction: column;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; border-bottom: 1px solid var(--v-line);
}
.brand { font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
.clock { font-size: 13px; color: var(--v-muted); }

  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  padding: 30px 20px;
  transition: background 0.25s ease;
}
